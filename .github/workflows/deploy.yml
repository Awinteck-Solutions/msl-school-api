name: Deploy MSL School API to AWS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_MSL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY_MSL }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
          | docker login --username AWS \
          --password-stdin ${{ secrets.ECR_REGISTRY_MSL }}

      - name: Build Docker image
        run: |
          docker build --no-cache -t mslapp:${{ github.sha }}  .

      - name: Tag image
        run: |
          docker tag mslapp:${{ github.sha }} \
          ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push \
          ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:${{ github.sha }}

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SERVER_IP_MSL }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY_MSL }}
          script: |
            docker pull ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:${{ github.sha }}
            docker stop mslapp-container || true
            docker rm mslapp-container || true
            docker run -d -p 8081:4001 \
              --name mslapp-container \
              --env-file .env-msl \
              --restart unless-stopped \
              ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:${{ github.sha }}
