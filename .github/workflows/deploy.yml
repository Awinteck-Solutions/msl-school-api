name: Deploy MSL School API to AWS

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_MSL }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY_MSL }}
          aws-region: ${{ secrets.AWS_REGION_MSL }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region us-east-1 \
          | docker login --username AWS \
          --password-stdin ${{ secrets.ECR_REGISTRY_MSL }}

      - name: Build Docker image
        run: |
          docker build -t mslapp:latest .

      - name: Tag image
        run: |
          docker tag mslapp:latest \
          ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:version2

      - name: Push image to ECR
        run: |
          docker push \
          ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:version2

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_IP_MSL }}
          username: ubuntu
          key: ${{ secrets.SERVER_SSH_KEY_MSL }}
          script: |
            docker pull ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:version2
            docker stop mslapp-container || true
            docker rm mslapp-container || true
            docker run -d -p 8081:4001 \
              --name mslapp-container \
              --env-file .env-msl \
              ${{ secrets.ECR_REGISTRY_MSL }}/taxlawgh:version2